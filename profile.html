<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet Pradhyumna Raj.B, a fullstack developer and first-year student at St Joseph University.">
  <title>Pradhyumna Raj.B | Project Atlas</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      place-items: center;
    }

    main {
      width: min(100%, 28rem);
    }

    .profile-card {
      padding: 2.5rem;
      border: 1px solid #dfe6f1;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1.25rem 3rem rgb(23 32 51 / 10%);
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: #4a62c2;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 8vw, 2.4rem);
      line-height: 1.15;
    }

    .role {
      margin: 0.5rem 0 1.5rem;
      color: #4a62c2;
      font-weight: 600;
    }

    .introduction {
      color: #536078;
      line-height: 1.7;
    }

    h2 {
      margin: 1.75rem 0 0.75rem;
      font-size: 1rem;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .skills li {
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: #edf1ff;
      color: #354ba2;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .profile-link {
      display: inline-flex;
      margin-top: 1.75rem;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      background: #354ba2;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    .profile-link:hover {
      background: #263a86;
    }

    .profile-link:focus-visible {
      outline: 3px solid #91a4ff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <article class="profile-card">
      <p class="eyebrow">Project Atlas · Developer</p>
      <h1>Pradhyumna Raj.B</h1>
      <p class="role">Fullstack Developer</p>
      <p class="introduction">I’m a first-year student at St Joseph University, learning to build thoughtful experiences for the web.</p>

      <section aria-labelledby="skills-heading">
        <h2 id="skills-heading">Skills</h2>
        <ul class="skills">
          <li>Python</li>
          <li>HTML</li>
          <li>JavaScript</li>
        </ul>
      </section>

      <a class="profile-link" href="https://github.com/Pradhyumnaraj" target="_blank" rel="noopener noreferrer">Visit my GitHub profile</a>
    </article>
  </main>
</body>
</html>
